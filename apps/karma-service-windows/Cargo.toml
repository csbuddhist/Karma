[package]
name = "karma-service-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "KarmaService"
path = "src/main.rs"

[[bin]]
name = "KarmaControl"
path = "src/control.rs"

[[bin]]
name = "KarmaGuardian"
path = "src/guardian.rs"

[dependencies]
karma-ipc = { path = "../../crates/karma-ipc" }
karma-disposition = { path = "../../crates/karma-disposition" }
karma-service-core = { path = "../../crates/karma-service-core" }
karma-policy = { path = "../../crates/karma-policy" }
karma-update = { path = "../../crates/karma-update" }
karma-windows-ipc = { path = "../../crates/karma-windows-ipc" }
serde.workspace = true
serde_json.workspace = true
rand = "0.8"
thiserror.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
