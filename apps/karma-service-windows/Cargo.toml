[package]
name = "karma-service-windows"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "KarmaService"
path = "src/main.rs"

[[bin]]
name = "KarmaControl"
path = "src/control.rs"

[dependencies]
karma-ipc = { path = "../../crates/karma-ipc" }
karma-disposition = { path = "../../crates/karma-disposition" }
karma-service-core = { path = "../../crates/karma-service-core" }
karma-windows-ipc = { path = "../../crates/karma-windows-ipc" }
rand = "0.8"
thiserror.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"
