org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Directory holding the exported viddexa-nano model.onnx + manifest.json
# (see docs/model-assets.md). Relative paths resolve from the repository root.
karma.modelDir=target/model-assets/viddexa-nano
# Set to false to build the APK against prebuilt jniLibs and bindings.
karma.buildRust=true
