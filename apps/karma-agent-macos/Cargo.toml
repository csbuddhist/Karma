[package]
name = "karma-agent-macos"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
karma-agent-core = { path = "../../crates/karma-agent-core" }
karma-ai = { path = "../../crates/karma-ai" }
karma-ipc = { path = "../../crates/karma-ipc" }
karma-macos = { path = "../../crates/karma-macos", features = ["session-agent"] }
karma-macos-ipc = { path = "../../crates/karma-macos-ipc" }
karma-onnx = { path = "../../crates/karma-onnx" }
serde_json.workspace = true
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
