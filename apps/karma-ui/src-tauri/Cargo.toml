[package]
name = "karma-ui"
version = "0.3.17"
description = "Password-protected local administration console for Karma"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "karma_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
karma-ipc = { path = "../../../crates/karma-ipc" }
karma-policy = { path = "../../../crates/karma-policy" }
karma-windows-ipc = { path = "../../../crates/karma-windows-ipc" }
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.8.5", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "2"
thiserror.workspace = true
zeroize = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"
