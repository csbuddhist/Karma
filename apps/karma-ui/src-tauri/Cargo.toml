[package]
name = "karma-ui"
version = "0.1.9"
description = "Password-protected local administration console for Karma"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "karma_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.4.1", features = [] }

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
karma-ipc = { path = "../../../crates/karma-ipc" }
karma-windows-ipc = { path = "../../../crates/karma-windows-ipc" }
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "=2.8.5", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-autostart = "=2.5.1"
thiserror.workspace = true
zeroize = "1"

[dev-dependencies]
tempfile = "3"
