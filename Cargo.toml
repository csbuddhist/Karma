[workspace]
members = [
    "apps/karma-agent-windows",
    "apps/karma-service-windows",
    "apps/karma-ui/src-tauri",
    "crates/karma-ai",
    "crates/karma-disposition",
    "crates/karma-domain",
    "crates/karma-evidence",
    "crates/karma-ipc",
    "crates/karma-onnx",
    "crates/karma-policy",
    "crates/karma-service-core",
    "crates/karma-windows",
    "crates/karma-windows-ipc",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
