[package]
name = "karma-mobile-ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "UniFFI export layer of the Karma decision core for mobile platforms"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]
name = "karma_mobile_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
# Builds the `uniffi-bindgen` CLI used to generate the Kotlin bindings.
bindgen = ["uniffi/cli"]

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
karma-ai = { path = "../karma-ai" }
karma-domain = { path = "../karma-domain" }
karma-policy = { path = "../karma-policy" }
rand = "0.8"
serde.workspace = true
serde_json.workspace = true
subtle = "2"
thiserror.workspace = true
uniffi = "=0.29.5"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
